# Static security analysis (CodeQL) of the Java backend and the TypeScript frontend.
# Results appear under the repository's Security > Code scanning tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because new query packs can flag old code even when nothing changed.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # needed to upload findings
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none # analyse the source directly; no build needed for these languages
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
