# On every pull request, compares the dependencies it adds or upgrades against known-vulnerability data
# and fails the check if a high-severity vulnerability would be introduced.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
